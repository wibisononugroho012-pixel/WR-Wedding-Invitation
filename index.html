<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WR Wedding Invitation</title>
  <link rel="icon" href="https://i.ibb.co.com/5gC6fn7w/Chat-GPT-Image-28-Sep-2026-18-48-48.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden; /* Mencegah scroll ganda */
    }

    .iframe-container {
      width: 100%;
      height: 100dvh; /* Menggunakan dvh agar pas di mobile browser */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <!-- Hapus atribut src dari sini, akan diisi otomatis oleh JavaScript -->
    <iframe
      id="app"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>

  <script>
    // 1. Tentukan URL dasar Google Script Anda
    const baseUrl = "https://script.google.com/macros/s/AKfycbyuLQfSAod7KOLwEwKUJl0JE4lweC9KloNXiJNn3iPkKAkmehwcT2Bkx87C3fWcYFcDuA/exec";
    
    // 2. Ambil parameter dari URL web GitHub saat ini (contoh: "?to=WR001")
    const queryString = window.location.search;
    
    // 3. Gabungkan URL dasar dengan parameter tersebut
    const finalUrl = baseUrl + queryString;
    
    // 4. Masukkan URL final ke dalam iframe
    document.getElementById("app").src = finalUrl;
  </script>
</body>
</html>
